<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kayachikitsa Roster - Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --bg:#0f172a; --card:rgba(30,41,59,.92); --border:rgba(148,163,184,.15); --text:#f1f5f9; --muted:#94a3b8; --primary:#3b82f6; --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --dms:#8b5cf6; --holiday:#1e40af; --sunday:#1e3a8a; }
  *{box-sizing:border-box;margin:0;padding:0} body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:var(--text);padding:20px;min-height:100vh}
.main-wrap{display:grid;grid-template-columns:1fr 320px;gap:20px;max-width:1900px;margin:0 auto}
.container{min-width:0}.header{text-align:center;margin-bottom:24px}.header h1{font-size:32px;font-weight:700;background:linear-gradient(135deg,#60a5fa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.config,.gcal-panel{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.7px}
  input,select,textarea{width:100%;background:rgba(15,23,42,.85);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.checkbox-group{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0}.checkbox-row{display:flex;align-items:center;gap:8px}.checkbox-row input{width:16px;height:16px}
.btn-group{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
  button{background:linear-gradient(135deg,var(--primary),#2563eb);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
  button:hover{transform:translateY(-1px)}button.secondary{background:rgba(71,85,105,.6)}button.success{background:linear-gradient(135deg,var(--success),#059669)}button.warning{background:linear-gradient(135deg,var(--warning),#d97706)}button.danger{background:linear-gradient(135deg,var(--danger),#dc2626)}button.dms-active{background:linear-gradient(135deg,var(--dms),#7c3aed)!important}
.table-wrap{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:22px;overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}thead th{background:rgba(59,130,246,.18);color:#93c5fd;padding:11px 9px;text-align:left;font-weight:600;border-bottom:2px solid var(--primary)}
  tbody td{padding:3px;border-bottom:1px solid var(--border);position:relative}
  tbody tr.sunday{background:rgba(30,58,138,.35);border-left:4px solid var(--sunday)}tbody tr.holiday{background:rgba(30,64,175,.35);border-left:4px solid var(--holiday)}tbody tr.sunday td:first-child,tbody tr.holiday td:first-child{font-weight:700;color:#93c5fd}
  select.duty-select{width:100%;background:rgba(15,23,42,.9);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--text);font-size:11px;cursor:pointer}
  select.duty-select:disabled{background:rgba(71,85,105,.3);color:var(--muted);cursor:not-allowed;text-decoration:line-through;opacity:.6}
  select.duty-select.manual{background:rgba(245,158,11,.15);border-color:var(--warning)}select.duty-select.dms{background:rgba(139,92,246,.22);border-color:var(--dms);box-shadow:0 0 0 2px rgba(139,92,246,.18)}select.duty-select.filled{background:rgba(16,185,129,.14);border-color:var(--success)}select.duty-select.conflict{background:rgba(239,68,68,.22);border-color:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}.conflict-badge{position:absolute;top:1px;right:1px;background:var(--danger);color:#fff;font-size:8px;padding:1px 4px;border-radius:3px;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stat-card{background:rgba(15,23,42,.6);border:1px solid var(--border);border-radius:9px;padding:10px 14px;flex:1;min-width:130px}.stat-card h4{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase}.stat-card.value{font-size:20px;font-weight:700;color:#06b6d4}
.legend{display:flex;gap:12px;margin:10px 0;font-size:11px;flex-wrap:wrap}.legend-item{display:flex;align-items:center;gap:5px}.legend-box{width:16px;height:16px;border-radius:3px}
.toast{position:fixed;top:18px;right:18px;background:var(--danger);color:#fff;padding:10px 16px;border-radius:9px;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:1000;animation:slideIn.25s;font-size:12px}@keyframes slideIn{from{transform:translateX(300px);opacity:0}to{transform:translateX(0);opacity:1}}
.leave-list{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:8px;margin-top:8px;font-size:11px}
.gcal-panel h3{font-size:15px;font-weight:600;margin-bottom:14px;color:#93c5fd}.gcal-list{max-height:400px;overflow-y:auto}.gcal-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(15,23,42,.6);border-radius:6px;margin-bottom:6px;font-size:12px}.gcal-item:hover{background:rgba(59,130,246,.15)}.gcal-date{color:#60a5fa;font-weight:600}.gcal-add{color:var(--success);cursor:pointer;font-size:16px}.gcal-add:hover{transform:scale(1.2)}
  @media(max-width:1200px){.main-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="main-wrap">
  <div class="container">
    <div class="header"><h1>Kayachikitsa Duty Roster</h1><p>Manual + DMS + Smart Auto-fill</p></div>

    <div class="config">
      <div class="grid">
        <div class="field"><label>3rd Year</label><input id="y3" value="Dr Rubi, Dr Aman, Dr Ayush, Dr Dharnendra"></div>
        <div class="field"><label>2nd Year</label><input id="y2" value="Dr Kirti, Dr Anjali, Dr Vaibhav, Dr Nisha"></div>
        <div class="field"><label>1st Year</label><input id="y1" value="Dr Jyoti, Dr Kundan, Dr Deepa, Dr Komal"></div>
        <div class="field"><label>Month</label><input type="month" id="month"></div>
        <div class="field"><label>Holidays</label><input id="holidays" placeholder="5, 15, 26"></div>
        <div class="field"><label>Leaves</label><textarea id="leaves" rows="1" placeholder="Dr Rubi: 5-8; Dr Aman: 10"></textarea></div>
        <div class="field" style="grid-column:1/-1"><label>Hospital</label><textarea id="hospital" rows="2">PG Department of Kayachikitsa
A & U TIBBIA COLLEGE AND HOSPITAL
KAROL BAGH, NEW DELHI – 110005</textarea></div>
      </div>

      <div class="checkbox-group">
        <div class="checkbox-row"><input type="checkbox" id="morningSundayHoliday" checked><label>Morning Sun/Holiday only</label></div>
        <div class="checkbox-row"><input type="checkbox" id="nightOffRule" checked><label>Night next day off</label></div>
      </div>

      <div id="leaveList"></div>

      <div class="btn-group">
        <button onclick="initTable()">1. Create Table</button>
        <button class="warning" onclick="autoFill()">2. Auto-Fill</button>
        <button id="dmsToggle" class="secondary" onclick="toggleDMS()">DMS Mode: OFF</button>
        <button class="success" onclick="exportPDF()">3. Download PDF</button>
        <button class="secondary" onclick="exportWord()">Word</button>
        <button class="secondary" onclick="exportExcel()">Excel</button>
        <button class="danger" onclick="clearDraft()">Clear</button>
        <button class="secondary" id="loadBtn" style="display:none" onclick="loadDraft()">Load</button>
      </div>
    </div>

    <div id="output"></div>
  </div>

  <div class="gcal-panel">
    <h3>📅 Google Calendar</h3>
    <button class="success" style="width:100%;margin-bottom:12px" onclick="addAllHolidays()">Add All Holidays to GCal</button>
    <div class="gcal-list" id="gcalList"></div>
  </div>
</div>

<script>
const jsPDF = window.jspdf?.jsPDF;
let roster=null, students=[], leaveMap={}, dmsMode=false, y3=[], y2=[], y1=[];
const KEY='kaya_v3';
const INDIAN_HOLIDAYS={'2026-01-26':'Republic Day','2026-03-08':'Maha Shivratri','2026-03-14':'Holi','2026-04-03':'Good Friday','2026-04-14':'Ambedkar Jayanti','2026-05-01':'Labour Day','2026-08-15':'Independence Day','2026-10-02':'Gandhi Jayanti','2026-10-20':'Diwali','2026-12-25':'Christmas'};

function getStudents(){ y3=document.getElementById('y3').value.split(',').map(s=>s.trim()).filter(Boolean); y2=document.getElementById('y2').value.split(',').map(s=>s.trim()).filter(Boolean); y1=document.getElementById('y1').value.split(',').map(s=>s.trim()).filter(Boolean); students=[...y3,...y2,...y1]; }
function parseLeaves(){ leaveMap={}; const str=document.getElementById('leaves').value.trim(); if(!str){document.getElementById('leaveList').innerHTML='';return;} let html='<div class="leave-list"><strong>Leaves:</strong> '; str.split(';').forEach(e=>{ const [n,d]=e.split(':').map(s=>s?.trim()); if(!n||!d) return; const days=[]; d.split(',').forEach(p=>{ p=p.trim(); if(p.includes('-')){ const [a,b]=p.split('-').map(Number); for(let i=a;i<=b;i++) days.push(i);} else days.push(Number(p));}); leaveMap[n]=days; html+=`${n} (${days.join(',')}) `;}); html+='</div>'; document.getElementById('leaveList').innerHTML=html; }
function isLeave(doc,day){ return leaveMap[doc]?.includes(day); }
function getYear(doc){ return y3.includes(doc)?3:y2.includes(doc)?2:1; }

function initTable(){
  const mv=document.getElementById('month').value; if(!mv) return toast('Pick month');
  getStudents(); parseLeaves(); const [yr,mo]=mv.split('-').map(Number); const dim=new Date(yr,mo,0).getDate();
  const hols=document.getElementById('holidays').value.split(',').map(d=>parseInt(d)).filter(Boolean);
  // merge built-in Indian holidays (hidden)
  Object.entries(INDIAN_HOLIDAYS).forEach(([d,name])=>{const [y,m,day]=d.split('-').map(Number); if(y===yr&&m===mo&&!hols.includes(day)) hols.push(day);});
  roster={year:yr,month:mo,hospital:document.getElementById('hospital').value,data:[]};
  for(let d=1;d<=dim;d++){ const dt=new Date(yr,mo-1,d); roster.data.push({date:`${String(d).padStart(2,'0')}/${String(mo).padStart(2,'0')}/${yr}`,dayName:dt.toLocaleDateString('en-US',{weekday:'long'}),day:d,isSun:dt.getDay()===0,isSat:dt.getDay()===6,isHol:hols.includes(d),m:'',e:'',n:'',mM:false,eM:false,nM:false,mD:false,eD:false,nD:false});}
  save(); render(); updateGCalList();
}

function render(){
  if(!roster) return; const {data,year,month,hospital}=roster; const monthName=new Date(year,month-1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); const morningOnly=document.getElementById('morningSundayHoliday').checked;
  const filled=data.reduce((a,r)=>a+(r.m?1:0)+(r.e?1:0)+(r.n?1:0),0); const conflicts=data.filter(r=>{const arr=[r.m,r.e,r.n].filter(Boolean);return new Set(arr).size!==arr.length}).length;

  let html=`<div class="table-wrap"><div style="text-align:center;margin-bottom:16px;line-height:1.5">${hospital.split('\n').map(l=>`<div style="font-weight:600">${l}</div>`).join('')}<div style="color:#94a3b8;font-size:12px;margin-top:4px">Duty roster for PG students of Dept. of KAYACHIKITSA for the month of ${monthName}</div></div>
  <div class="stats"><div class="stat-card"><h4>Filled</h4><div class="value">${filled}</div></div><div class="stat-card"><h4>Remaining</h4><div class="value">${data.length*3-filled}</div></div><div class="stat-card"><h4>Conflicts</h4><div class="value" style="color:${conflicts?'#ef4444':'#10b981'}">${conflicts}</div></div></div>
  <div class="legend"><div class="legend-item"><div class="legend-box" style="background:rgba(245,158,11,.15);border:1px solid #f59e0b"></div>Manual</div><div class="legend-item"><div class="legend-box" style="background:rgba(139,92,246,.22);border:1px solid #8b5cf6"></div>DMS</div><div class="legend-item"><div class="legend-box" style="background:rgba(16,185,129,.14);border:1px solid #10b981"></div>Auto</div><div class="legend-item"><div class="legend-box" style="background:rgba(30,64,175,.4);border:1px solid #1e40af"></div>Holiday/Sunday</div></div>
  <table><thead><tr><th>Date</th><th>Day</th><th>Morning</th><th>Evening</th><th>Night</th></tr></thead><tbody>`;

  data.forEach((r,i)=>{ const cls=r.isSun?'sunday':r.isHol?'holiday':''; const mDis=morningOnly&&!r.isSun&&!r.isHol; html+=`<tr class="${cls}"><td>${r.date}</td><td>${r.dayName}</td><td>${sel(i,'m',r.m,r.mM,r.mD,mDis,r.day)}</td><td>${sel(i,'e',r.e,r.eM,r.eD,false,r.day)}</td><td>${sel(i,'n',r.n,r.nM,r.nD,false,r.day)}</td></tr>`; });
  html+=`</tbody></table></div>`; document.getElementById('output').innerHTML=html;
}

function sel(idx,sh,val,isMan,isDMS,dis,day){ 
  const r=roster.data[idx]; const conflict=[r.m,r.e,r.n].filter(v=>v===val&&val).length>1; let cls=''; 
  if(val){ cls=isDMS?'dms':isMan?'manual':'filled'; } if(conflict) cls+=' conflict'; 
  let opts='<option value="">-</option>'; 
  students.forEach(s=>{ const leave=isLeave(s,day); const thirdNoMorning=sh==='m'&&y3.includes(s); opts+=`<option value="${s}" ${s===val?'selected':''} ${leave||thirdNoMorning?'disabled':''}>${s}${leave?' (Leave)':''}${thirdNoMorning?' (No AM)':''}</option>`; }); 
  return `${conflict?'<span class="conflict-badge">⚠</span>':''}<select class="duty-select ${cls}" ${dis?'disabled':''} onchange="setDuty(${idx},'${sh}',this.value)">${opts}</select>`; 
}

function setDuty(i,sh,val){ const r=roster.data[i]; if(val&&isLeave(val,r.day)){ toast(`${val} is on leave on ${r.date}`,'warning'); return render(); } r[sh]=val; r[sh+'M']=!!val; r[sh+'D']=dmsMode&&!!val; if(val&&[r.m,r.e,r.n].filter(v=>v===val).length>1) toast(`⚠️ ${val} double-booked ${r.date}`); save(); render(); }

function toggleDMS(){ dmsMode=!dmsMode; const b=document.getElementById('dmsToggle'); b.textContent=`DMS Mode: ${dmsMode?'ON':'OFF'}`; b.classList.toggle('dms-active',dmsMode); }

function autoFill(){
  if(!roster) return toast('Create table first'); parseLeaves(); const {data}=roster; const nightOff=document.getElementById('nightOffRule').checked;
  
  // keep manual/DMS entries, clear previous auto fills for rebalance
  data.forEach(r=>{ if(!r.mM){ r.m=''; r.mD=false; } if(!r.eM){ r.e=''; r.eD=false; } if(!r.nM){ r.n=''; r.nD=false; } });
  
  const cnt={}; students.forEach(s=>cnt[s]={total:0,good:0,bad:0});
  const dutyQuality=(r,sh,idx)=>{ const nxt=data[idx+1]; const preHol=nxt?.isHol; if(sh==='n'){ if(r.isSat||preHol) return -1; if(r.isSun||r.isHol) return 0; return 1;} if(sh==='e'){ if(r.isSat||r.isSun||r.isHol) return -1; return 0;} if(sh==='m') return -1; return 0; };
  data.forEach((r,i)=>{ [['m',r.m],['e',r.e],['n',r.n]].forEach(([sh,doc])=>{ if(!doc) return; cnt[doc].total++; const q=dutyQuality(r,sh,i); if(q>0) cnt[doc].good++; else if(q<0) cnt[doc].bad++; }); });

  const weight=s=> y3.includes(s)?1.3 : y2.includes(s)?1.1 : 1.0;
  const seniorBonus=(s,q)=> q>0 ? (y3.includes(s)?0.4:y2.includes(s)?0.2:0) : q<0 ? (y1.includes(s)?0.3:y2.includes(s)?0.15:0) : 0;

  // Morning assignments - Sundays & holidays (respect manual locks)
  const suns=data.filter(r=>r.isSun&&!r.m);
  const hols=data.filter(r=>r.isHol&&!r.isSun&&!r.m);
  let p1=[...y1], p2=[...y2];
  suns.forEach((r,idx)=>{ const pool = idx < y1.length ? p1 : p2; for(let k=0;k<pool.length*2;k++){ const s=pool[0]; if(!isLeave(s,r.day)&&(!nightOff||!data[r.day-2]?.n||data[r.day-2].n!==s)&&s!==r.e&&s!==r.n){ r.m=s; r.mM=false; cnt[s].total++; cnt[s].bad++; pool.push(pool.shift()); break;} pool.push(pool.shift()); } });
  hols.forEach(r=>{ for(let k=0;k<p2.length*2;k++){ const s=p2[0]; if(!isLeave(s,r.day)&&(!nightOff||!data[r.day-2]?.n||data[r.day-2].n!==s)&&s!==r.e&&s!==r.n){ r.m=s; r.mM=false; cnt[s].total++; cnt[s].bad++; p2.push(p2.shift()); break;} p2.push(p2.shift()); } });

  const pick=(r,idx,sh)=>{ const q=dutyQuality(r,sh,idx); return students.filter(s=>!isLeave(s,r.day)&&s!==r.m&&s!==r.e&&s!==r.n&&!(nightOff&&idx>0&&data[idx-1].n===s)).sort((a,b)=>{ const sa=cnt[a].total/weight(a)+cnt[a].bad*0.6-cnt[a].good*0.3 - seniorBonus(a,q); const sb=cnt[b].total/weight(b)+cnt[b].bad*0.6-cnt[b].good*0.3 - seniorBonus(b,q); return sa-sb; })[0]; };

  data.forEach((r,idx)=>{
    if(!r.n){ const c=pick(r,idx,'n'); if(c){ r.n=c; r.nM=false; r.nD=false; cnt[c].total++; const q=dutyQuality(r,'n',idx); if(q>0) cnt[c].good++; else if(q<0) cnt[c].bad++; } }
    if(!r.e){ const c=pick(r,idx,'e'); if(c){ r.e=c; r.eM=false; r.eD=false; cnt[c].total++; const q=dutyQuality(r,'e',idx); if(q>0) cnt[c].good++; else if(q<0) cnt[c].bad++; } }
  });

  save(); render(); toast('Auto-fill rebalanced (manual locks kept)','success');
}

function updateGCalList(){
  if(!roster) return; const {year,month}=roster; const hols=document.getElementById('holidays').value.split(',').map(d=>parseInt(d)).filter(Boolean);
  let html=''; hols.forEach(d=>{ const dt=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`; html+=`<div class="gcal-item"><div><div class="gcal-date">${d}/${month}</div><div style="color:#94a3b8">Custom Holiday</div></div><div class="gcal-add" onclick="addToGCal('${dt}','Holiday')">+</div></div>`; });
  Object.entries(INDIAN_HOLIDAYS).forEach(([date,name])=>{ const [y,m,d]=date.split('-').map(Number); if(y===year&&m===month){ html+=`<div class="gcal-item"><div><div class="gcal-date">${d}/${m}</div><div style="color:#94a3b8">${name}</div></div><div class="gcal-add" onclick="addToGCal('${date}','${name}')">+</div></div>`; }});
  document.getElementById('gcalList').innerHTML=html||'<div style="color:#94a3b8;text-align:center;padding:20px">No holidays this month</div>';
}

function addToGCal(date,title){ const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${date.replace(/-/g,'')}/${date.replace(/-/g,'')}&details=${encodeURIComponent('Kayachikitsa Department Holiday')}`; window.open(url,'_blank'); }
function addAllHolidays(){ if(!roster) return; const {year,month}=roster; const hols=document.getElementById('holidays').value.split(',').map(d=>parseInt(d)).filter(Boolean); hols.forEach((d,i)=>{ const dt=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`; setTimeout(()=>addToGCal(dt,'Holiday'),i*200); }); toast('Opening Google Calendar tabs...','success'); }

function exportPDF(){
  if(!roster||!jsPDF) return toast('Create first or PDF lib missing'); const {data,year,month,hospital}=roster; const monthName=new Date(year,month-1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const doc=new jsPDF({format:'a4'}); doc.setFont('times','normal'); let y=14; doc.setFontSize(12); hospital.split('\n').forEach(l=>{doc.text(l.trim(),105,y,{align:'center'});y+=5.5}); doc.setFontSize(11); doc.text(`Duty roster for PG students of Dept. of KAYACHIKITSA for the month of ${monthName}`,105,y,{align:'center'}); y+=8;
  const body=data.map(r=>[r.date,r.dayName,r.m||'-',r.e||'-',r.n||'-']);
  doc.autoTable({startY:y,head:[['Date','Day','Morning','Evening','Night']],body,styles:{font:'times',fontSize:8.2,cellPadding:1.4,lineColor:[180,200,220],lineWidth:0.1},headStyles:{fillColor:[0,176,190],textColor:255,fontStyle:'bold',halign:'center'},columnStyles:{0:{halign:'center',cellWidth:20},1:{halign:'center',cellWidth:24},2:{halign:'center'},3:{halign:'center'},4:{halign:'center'}},margin:{left:12,right:12,bottom:15},pageBreak:'avoid',didParseCell:d=>{ if(d.section==='body'){ const r=data[d.row.index]; const isHol=r.isHol; const isSun=d.row.raw[1]==='Sunday'; if(isHol||isSun){ d.cell.styles.fillColor=[197,231,239]; }
    if(d.column.index===2 && r.mD) d.cell.styles.fontStyle='bold';
    if(d.column.index===3 && r.eD) d.cell.styles.fontStyle='bold';
    if(d.column.index===4 && r.nD) d.cell.styles.fontStyle='bold';
  } }});
  let fy=doc.lastAutoTable.finalY+6; doc.setFontSize(9.5); doc.text('The next day of night duty will be considered as off.',14,fy); doc.text('The duty will not be interchanged without prior permission of HOD of KAYACHIKITSA department.',14,fy+5); doc.text('Copy to:',14,fy+12); doc.text('All PG Students',14,fy+17); doc.setFont('times','bold'); doc.text('Dr Sujata Yadav',150,fy+24); doc.setFont('times','normal'); doc.text('HOD, Department of Kayachikitsa',150,fy+29); doc.save(`Kayachikitsa_${monthName.replace(' ','_')}.pdf`);
}

function exportWord(){
  if(!roster) return toast('Create first');
  const {data,year,month,hospital}=roster; const monthName=new Date(year,month-1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset="UTF-8"><title>Roster</title><style>@page WordSection1{size:595.3pt 841.9pt;margin:36pt 36pt 36pt 36pt;}div.WordSection1{page:WordSection1;}body{font-family:"Times New Roman",serif;font-size:10pt}h3{margin:1pt 0;text-align:center;font-size:12pt}h4{margin:2pt 0;text-align:center;font-size:11pt;font-weight:normal}table{border-collapse:collapse;width:100%;table-layout:fixed}col.c1{width:9%}col.c2{width:12%}col.c3{width:26.3%}col.c4{width:26.3%}col.c5{width:26.4%}th{background:#00b0be;color:#fff;padding:2pt 1pt;border:0.5pt solid #444;font-size:9.5pt;text-align:center}td{border:0.5pt solid #777;padding:1.5pt 1pt;text-align:center;font-size:9pt;line-height:1.05;vertical-align:middle}tr{page-break-inside:avoid}.hol{background:#eef7fa}.dms{font-weight:bold}p{margin:3pt 0;font-size:9.5pt}</style></head><body><div class="WordSection1">`;
  hospital.split('\n').forEach(l=>html+=`<h3>${l}</h3>`);
  html+=`<h4>Duty roster for PG students of Dept. of KAYACHIKITSA for ${monthName}</h4><table><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup><tr><th>Date</th><th>Day</th><th>Morning</th><th>Evening</th><th>Night</th></tr>`;
  data.forEach(r=>{const c=r.isHol||r.dayName==='Sunday'?' class="hol"':'';const m=r.mD?`<span class="dms">${r.m||'-'}</span>`:r.m||'-';const e=r.eD?`<span class="dms">${r.e||'-'}</span>`:r.e||'-';const n=r.nD?`<span class="dms">${r.n||'-'}</span>`:r.n||'-';html+=`<tr${c}><td>${r.date}</td><td>${r.dayName.substring(0,3)}</td><td>${m}</td><td>${e}</td><td>${n}</td></tr>`});
  html+=`</table><p>The next day of night duty will be considered as off.<br>The duty will not be interchanged without prior permission of HOD.</p><p>Copy to: All PG Students</p><p style="text-align:right;margin-top:12pt"><b>Dr Sujata Yadav</b><br>HOD, Kayachikitsa</p></div></body></html>`;
  const blob=new Blob(['\ufeff',html],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Kayachikitsa_${monthName.replace(' ','_')}.doc`;a.click();toast('Word exported – portrait, 1 page','success');
}

function exportExcel(){ if(!roster) return; const {data,year,month,hospital}=roster; const mn=new Date(year,month-1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); const ws=XLSX.utils.aoa_to_sheet([...hospital.split('\n').map(l=>[l]),[`Duty roster for PG students of Dept. of KAYACHIKITSA for the month of ${mn}`],[],['Date','Day','Morning','Evening','Night'],...data.map(r=>[r.date,r.dayName,r.m||'-',r.e||'-',r.n||'-']),[],['The next day of night duty will be considered as off.'],['The duty will not be interchanged without prior permission of HOD of KAYACHIKITSA department.'],[],['Copy to:'],['All PG Students'],[],['','','','Dr Sujata Yadav'],['','','','HOD, Department of Kayachikitsa']]); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Roster'); XLSX.writeFile(wb,`Kayachikitsa_${mn.replace(' ','_')}.xlsx`); }

function save(){ if(!roster) return; localStorage.setItem(KEY,JSON.stringify({roster,settings:{y3:document.getElementById('y3').value,y2:document.getElementById('y2').value,y1:document.getElementById('y1').value,holidays:document.getElementById('holidays').value,leaves:document.getElementById('leaves').value,hospital:document.getElementById('hospital').value,morning:document.getElementById('morningSundayHoliday').checked,nightOff:document.getElementById('nightOffRule').checked}})); document.getElementById('loadBtn').style.display='inline-block'; }
function loadDraft(){ const d=localStorage.getItem(KEY); if(!d) return; const p=JSON.parse(d); Object.entries(p.settings).forEach(([k,v])=>{const el={y3:'y3',y2:'y2',y1:'y1',holidays:'holidays',leaves:'leaves',hospital:'hospital'}[k]; if(el) document.getElementById(el).value=v; if(k==='morning') document.getElementById('morningSundayHoliday').checked=v; if(k==='nightOff') document.getElementById('nightOffRule').checked=v;}); roster=p.roster; getStudents(); parseLeaves(); render(); updateGCalList(); toast('Draft loaded','success'); }
function clearDraft(){ if(confirm('Clear all?')){localStorage.removeItem(KEY);location.reload();} }
function toast(msg,type='danger'){ const t=document.createElement('div'); t.className='toast'; t.style.background=type==='success'?'var(--success)':type==='warning'?'var(--warning)':'var(--danger)'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }

window.addEventListener('DOMContentLoaded',()=>{ document.getElementById('month').value=new Date().toISOString().slice(0,7); if(localStorage.getItem(KEY)) document.getElementById('loadBtn').style.display='inline-block'; });
</script>
</body>
